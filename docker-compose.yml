# version: '3.11'

services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile-req
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
    volumes:
      - ./backend:/app
    image: django-backend

  db:
    image: postgres:13
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
